# Builds the FrancMap Windows desktop app on a Windows runner and publishes it as a
# GitHub Release, so it can be downloaded from a public link without an account.
# Triggers: a push that changes the desktop app or this workflow, a pushed tag like v1.3.0,
# or a manual run from the Actions tab. The release tag is v<version from desktop/package.json>
# unless a tag push or a manual input says otherwise; gh creates the tag if it is missing.
name: Desktop release (Windows)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "scripts/build-desktop.mjs"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (default: v<desktop/package.json version>)"
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Windows app
        run: npm run desktop:win

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"
          else TAG="v$(node -p "require('./desktop/package.json').version")"; fi
          echo "Release tag: $TAG"
          ZIP=$(ls release/*.zip)
          NOTES="FrancMap for Windows. Download the zip, unzip it anywhere and run FrancMap.exe.
          If Windows SmartScreen warns (unsigned app): More info -> Run anyway.
          Works offline: caves, points of interest and municipalities are bundled."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "FrancMap $TAG (Windows)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
